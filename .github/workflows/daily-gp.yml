# Makes tomorrow's Daily Challenge: picks a random seed, tests it by racing the reference cars on its tracks (retrying
# with a new seed if the day is not fit to race), and stores it in the board database before 00:00 UTC.
# The seed is secret until the day is over, so it is masked and never printed (this repository's logs are public).
# Needs the same two repository secrets as the weekly one: CLOUDFLARE_API_TOKEN (permission: D1 Edit) and CLOUDFLARE_ACCOUNT_ID.
# If this ever fails, nothing breaks: the server still picks an untested random seed the first time the day is asked for.
name: Daily Challenge

on:
  schedule:
    - cron: '0 12 * * *' # every day 12:00 UTC, twelve hours before the new day starts
  workflow_dispatch:

permissions:
  contents: read
  actions: write # lets the last step keep this schedule from being paused

concurrency:
  group: daily-gp

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pick and test tomorrow's seed
        run: npx tsx scripts/dailyPick.ts --out "$RUNNER_TEMP/day.json"
      - name: Store it in the board database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DAY=$(node -p "require('$RUNNER_TEMP/day.json').day")
          SEED=$(node -p "require('$RUNNER_TEMP/day.json').seed")
          echo "::add-mask::$SEED"
          echo "CREATE TABLE IF NOT EXISTS days (day INTEGER PRIMARY KEY, seed INTEGER NOT NULL); INSERT OR IGNORE INTO days (day, seed) VALUES ($DAY, $SEED);" > "$RUNNER_TEMP/store.sql"
          npx wrangler d1 execute crashlab --remote --config server/wrangler.toml --file "$RUNNER_TEMP/store.sql" > /dev/null
          # Did our seed end up stored? (Not if someone had already asked for that day: the server had picked its own.)
          npx wrangler d1 execute crashlab --remote --config server/wrangler.toml --json \
            --command "SELECT COUNT(*) AS n FROM days WHERE day = $DAY AND seed = $SEED" > "$RUNNER_TEMP/check.json"
          if [ "$(node -p "require('$RUNNER_TEMP/check.json')[0].results[0].n")" != "1" ]; then
            echo "Day $DAY already had a different seed, so the tested one was not stored."
            exit 1
          fi
          echo "Day $DAY stored."
      # GitHub pauses a schedule after 60 days without repository activity; switching the workflow on again resets that
      - name: Keep the schedule running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/daily-gp.yml/enable"
